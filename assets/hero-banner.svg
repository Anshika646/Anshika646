<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#161326" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#0E121A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0B0D12" stop-opacity="1" />
    </radialGradient>

    <!-- Center 3D Core Glow -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7957FF" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#32D8F5" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#79F2C0" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0B0D12" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients for 3D Rings & Shapes -->
    <linearGradient id="grad-ring-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7957FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#32D8F5" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#79F2C0" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="grad-ring-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#79F2C0" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#32D8F5" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7957FF" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F5F7FA" />
      <stop offset="70%" stop-color="#32D8F5" />
      <stop offset="100%" stop-color="#79F2C0" />
    </linearGradient>

    <!-- Cube Shading Gradients -->
    <linearGradient id="cube-top-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79F2C0" />
      <stop offset="100%" stop-color="#32D8F5" />
    </linearGradient>
    <linearGradient id="cube-left-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7957FF" />
      <stop offset="100%" stop-color="#4C2BD9" />
    </linearGradient>
    <linearGradient id="cube-right-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#32D8F5" />
      <stop offset="100%" stop-color="#1A9EB8" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .mono-text {
        font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', 'Cascadia Code', monospace;
      }
      .sans-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(3deg); }
      }
      @keyframes floatMedium {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(-4deg); }
      }
      @keyframes floatOpposite {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(11px) rotate(5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 0.95; transform: scale(1.04); }
      }
      @keyframes spinStar {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .floating-obj-1 { animation: floatSlow 5.5s ease-in-out infinite; }
      .floating-obj-2 { animation: floatMedium 7s ease-in-out infinite; }
      .floating-obj-3 { animation: floatOpposite 6.2s ease-in-out infinite; }
      .pulse-item { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="360" rx="16" fill="#0B0D12" />
  <rect width="1000" height="360" rx="16" fill="url(#bg-glow)" />

  <!-- Subtle Ambient Technical Grid -->
  <g stroke="#1C202C" stroke-width="0.75" opacity="0.35">
    <line x1="120" y1="0" x2="120" y2="360" stroke-dasharray="2, 6" />
    <line x1="280" y1="0" x2="280" y2="360" stroke-dasharray="2, 6" />
    <line x1="500" y1="0" x2="500" y2="360" stroke-dasharray="3, 5" stroke="#252D3D" opacity="0.6" />
    <line x1="720" y1="0" x2="720" y2="360" stroke-dasharray="2, 6" />
    <line x1="880" y1="0" x2="880" y2="360" stroke-dasharray="2, 6" />
    <line x1="0" y1="70" x2="1000" y2="70" stroke-dasharray="2, 6" />
    <line x1="0" y1="180" x2="1000" y2="180" stroke-dasharray="3, 5" stroke="#252D3D" opacity="0.6" />
    <line x1="0" y1="290" x2="1000" y2="290" stroke-dasharray="2, 6" />
  </g>

  <!-- Outer Frame -->
  <rect x="1.5" y="1.5" width="997" height="357" rx="15" fill="none" stroke="#1C202C" stroke-width="1.5" />
  <circle cx="16" cy="16" r="3" fill="#7957FF" opacity="0.7" />
  <circle cx="28" cy="16" r="3" fill="#32D8F5" opacity="0.7" />
  <circle cx="40" cy="16" r="3" fill="#79F2C0" opacity="0.7" />

  <!-- Center Ambient Core Glow -->
  <circle cx="500" cy="175" r="230" fill="url(#core-glow)" class="pulse-item" />

  <!-- ==================== 3D IRIDESCENT ORBITAL RINGS ==================== -->
  <g id="iridescent-geometry" transform="translate(500, 175)">
    <!-- Ring 1 -->
    <ellipse cx="0" cy="0" rx="320" ry="100" fill="none" stroke="url(#grad-ring-1)" stroke-width="2.4" transform="rotate(-16)" opacity="0.8" />
    <!-- Ring 2 -->
    <ellipse cx="0" cy="0" rx="285" ry="85" fill="none" stroke="url(#grad-ring-2)" stroke-width="2" transform="rotate(22)" opacity="0.65" />

    <!-- 3D Glowing Orbit Beads -->
    <g transform="rotate(-16)">
      <circle cx="-300" cy="0" r="5" fill="#7957FF" filter="url(#soft-glow)" />
      <circle cx="300" cy="0" r="5.5" fill="#79F2C0" filter="url(#soft-glow)" />
      <circle cx="0" cy="-95" r="4" fill="#32D8F5" filter="url(#soft-glow)" />
    </g>

    <!-- Inner Torus Curves -->
    <ellipse cx="0" cy="0" rx="190" ry="55" fill="none" stroke="#7957FF" stroke-width="1.2" stroke-opacity="0.35" transform="rotate(5)" />
    <ellipse cx="0" cy="0" rx="150" ry="42" fill="none" stroke="#32D8F5" stroke-width="1" stroke-opacity="0.25" transform="rotate(-8)" />
  </g>

  <!-- ==================== 3D FLOATING SHAPES (+, −, CUBES, STARS, CIRCLES) ==================== -->

  <!-- 1. ISOMETRIC 3D CUBE 1 (Left Top) -->
  <g class="floating-obj-1" transform="translate(100, 70)">
    <!-- Top Face -->
    <polygon points="26,0 52,15 26,30 0,15" fill="url(#cube-top-1)" filter="url(#soft-glow)" />
    <!-- Left Face -->
    <polygon points="0,15 26,30 26,60 0,45" fill="url(#cube-left-1)" />
    <!-- Right Face -->
    <polygon points="26,30 52,15 52,45 26,60" fill="url(#cube-right-1)" />
    <!-- Edges -->
    <line x1="26" y1="30" x2="26" y2="60" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6" />
  </g>

  <!-- 2. ISOMETRIC 3D CUBE 2 (Right Bottom) -->
  <g class="floating-obj-2" transform="translate(845, 230)">
    <!-- Top Face -->
    <polygon points="22,0 44,13 22,26 0,13" fill="url(#cube-top-1)" filter="url(#soft-glow)" />
    <!-- Left Face -->
    <polygon points="0,13 22,26 22,52 0,39" fill="url(#cube-left-1)" />
    <!-- Right Face -->
    <polygon points="22,26 44,13 44,39 22,52" fill="url(#cube-right-1)" />
    <line x1="22" y1="26" x2="22" y2="52" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6" />
  </g>

  <!-- 3. ISOMETRIC 3D CUBE 3 (Right Top) -->
  <g class="floating-obj-3" transform="translate(860, 60)">
    <!-- Top Face -->
    <polygon points="16,0 32,9 16,18 0,9" fill="#79F2C0" opacity="0.9" />
    <!-- Left Face -->
    <polygon points="0,9 16,18 16,36 0,27" fill="#7957FF" opacity="0.8" />
    <!-- Right Face -->
    <polygon points="16,18 32,9 32,27 16,36" fill="#32D8F5" opacity="0.85" />
  </g>

  <!-- 4. GLOWING 4-POINT STARS / SPARKLES -->
  <!-- Star 1: Large Mint Star (Top Left) -->
  <g class="floating-obj-2" transform="translate(230, 65)">
    <path d="M 0,-16 Q 0,0 16,0 Q 0,0 0,16 Q 0,0 -16,0 Q 0,0 0,-16 Z" fill="#79F2C0" filter="url(#soft-glow)" />
  </g>

  <!-- Star 2: Cyan Star (Top Right) -->
  <g class="floating-obj-1" transform="translate(750, 75)">
    <path d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" fill="#32D8F5" filter="url(#soft-glow)" />
  </g>

  <!-- Star 3: Violet Star (Bottom Left) -->
  <g class="floating-obj-3" transform="translate(150, 260)">
    <path d="M 0,-14 Q 0,0 14,0 Q 0,0 0,14 Q 0,0 -14,0 Q 0,0 0,-14 Z" fill="#7957FF" filter="url(#soft-glow)" />
  </g>

  <!-- Star 4: Mint Sparkle (Bottom Right) -->
  <g class="floating-obj-1" transform="translate(760, 275)">
    <path d="M 0,-15 Q 0,0 15,0 Q 0,0 0,15 Q 0,0 -15,0 Q 0,0 0,-15 Z" fill="#79F2C0" filter="url(#soft-glow)" />
  </g>

  <!-- Star 5: Mini Cyan Sparkle (Mid Left) -->
  <g class="floating-obj-2" transform="translate(70, 190)">
    <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#32D8F5" />
  </g>

  <!-- Star 6: Mini Mint Sparkle (Mid Right) -->
  <g class="floating-obj-3" transform="translate(930, 160)">
    <path d="M 0,-11 Q 0,0 11,0 Q 0,0 0,11 Q 0,0 -11,0 Q 0,0 0,-11 Z" fill="#79F2C0" />
  </g>

  <!-- 5. FLOATING "+" (PLUS) SIGNS -->
  <!-- Plus 1: Cyan (Left) -->
  <g class="floating-obj-1" transform="translate(290, 115)">
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#32D8F5" stroke-width="3.5" stroke-linecap="round" filter="url(#soft-glow)" />
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#32D8F5" stroke-width="3.5" stroke-linecap="round" filter="url(#soft-glow)" />
  </g>

  <!-- Plus 2: Electric Violet (Right) -->
  <g class="floating-obj-2" transform="translate(710, 235)">
    <line x1="-11" y1="0" x2="11" y2="0" stroke="#7957FF" stroke-width="3.5" stroke-linecap="round" filter="url(#soft-glow)" />
    <line x1="0" y1="-11" x2="0" y2="11" stroke="#7957FF" stroke-width="3.5" stroke-linecap="round" filter="url(#soft-glow)" />
  </g>

  <!-- Plus 3: Mint (Bottom Left) -->
  <g class="floating-obj-3" transform="translate(260, 275)">
    <line x1="-9" y1="0" x2="9" y2="0" stroke="#79F2C0" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="-9" x2="0" y2="9" stroke="#79F2C0" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Plus 4: Cyan (Far Right) -->
  <g class="floating-obj-1" transform="translate(920, 270)">
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#32D8F5" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#32D8F5" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- 6. FLOATING "−" (MINUS) SIGNS -->
  <!-- Minus 1: Mint (Left) -->
  <g class="floating-obj-2" transform="translate(180, 165)">
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#79F2C0" stroke-width="3.5" stroke-linecap="round" filter="url(#soft-glow)" />
  </g>

  <!-- Minus 2: Cyan (Right) -->
  <g class="floating-obj-3" transform="translate(810, 160)">
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#32D8F5" stroke-width="3.5" stroke-linecap="round" filter="url(#soft-glow)" />
  </g>

  <!-- Minus 3: Violet (Top) -->
  <g class="floating-obj-1" transform="translate(370, 65)">
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#7957FF" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Minus 4: Mint (Top Right) -->
  <g class="floating-obj-2" transform="translate(650, 65)">
    <line x1="-11" y1="0" x2="11" y2="0" stroke="#79F2C0" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- 7. FLOATING 3D DIAMONDS / OCTAHEDRONS -->
  <g class="floating-obj-3" transform="translate(115, 125)">
    <polygon points="0,-16 12,0 0,16 -12,0" fill="#7957FF" opacity="0.8" />
    <polygon points="0,-16 12,0 0,0" fill="#32D8F5" opacity="0.9" filter="url(#soft-glow)" />
    <polygon points="-12,0 0,16 0,0" fill="#79F2C0" opacity="0.9" />
  </g>

  <g class="floating-obj-1" transform="translate(895, 120)">
    <polygon points="0,-14 10,0 0,14 -10,0" fill="#32D8F5" opacity="0.85" filter="url(#soft-glow)" />
    <polygon points="0,-14 10,0 0,0" fill="#79F2C0" opacity="0.9" />
    <polygon points="-10,0 0,14 0,0" fill="#7957FF" opacity="0.8" />
  </g>

  <!-- 8. FLOATING CIRCLES & HOLLOW RINGS -->
  <!-- Ring (Cyan, Left) -->
  <g class="floating-obj-1" transform="translate(80, 280)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#32D8F5" stroke-width="2.5" opacity="0.8" filter="url(#soft-glow)" />
    <circle cx="0" cy="0" r="4" fill="#79F2C0" />
  </g>

  <!-- Solid Sphere (Violet, Right) -->
  <g class="floating-obj-2" transform="translate(710, 105)">
    <circle cx="0" cy="0" r="7" fill="#7957FF" filter="url(#soft-glow)" />
  </g>

  <!-- Ring (Mint, Right Bottom) -->
  <g class="floating-obj-3" transform="translate(815, 305)">
    <circle cx="0" cy="0" r="11" fill="none" stroke="#79F2C0" stroke-width="2" opacity="0.75" />
    <circle cx="0" cy="0" r="3" fill="#32D8F5" />
  </g>

  <!-- Small Mint Node -->
  <circle cx="340" cy="270" r="4.5" fill="#79F2C0" class="floating-obj-1" filter="url(#soft-glow)" />
  <!-- Small Cyan Node -->
  <circle cx="670" cy="285" r="4" fill="#32D8F5" class="floating-obj-2" filter="url(#soft-glow)" />

  <!-- ==================== MAIN HERO TYPOGRAPHY ==================== -->
  <g transform="translate(500, 185)">
    <!-- Diffuse Lighting Behind Name -->
    <ellipse cx="0" cy="-6" rx="250" ry="48" fill="#7957FF" opacity="0.25" filter="url(#glow-blur)" />
    <ellipse cx="0" cy="-6" rx="180" ry="32" fill="#32D8F5" opacity="0.32" filter="url(#glow-blur)" />

    <!-- Name Shadow -->
    <text x="0" y="0" text-anchor="middle" class="sans-text" font-size="84" font-weight="900" letter-spacing="14" fill="#0B0D12" stroke="#161A24" stroke-width="6" opacity="0.85">ANSHIKA</text>

    <!-- Prominent Name Text with Gradient Fill & Glow -->
    <text x="0" y="0" text-anchor="middle" class="sans-text" font-size="84" font-weight="900" letter-spacing="14" fill="url(#name-grad)" filter="url(#soft-glow)">ANSHIKA</text>

    <!-- Subtitle Strip -->
    <g transform="translate(0, 44)">
      <rect x="-240" y="-16" width="480" height="28" rx="14" fill="#121622" stroke="#222B3D" stroke-width="1" opacity="0.95" />
      <text x="0" y="3" text-anchor="middle" class="mono-text" font-size="11.5" font-weight="600" letter-spacing="3.5" fill="#A4ADBA">
        <tspan fill="#32D8F5">PYTHON</tspan> • <tspan fill="#7957FF">MACHINE LEARNING</tspan> • <tspan fill="#79F2C0">SQL</tspan> • <tspan fill="#F5F7FA">DATA ANALYSIS</tspan>
      </text>
    </g>
  </g>
</svg>
