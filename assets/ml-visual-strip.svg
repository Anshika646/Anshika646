<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="strip-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10141E" />
      <stop offset="100%" stop-color="#0B0D12" />
    </linearGradient>

    <linearGradient id="card-panel-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141926" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0E121A" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="grad-violet-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7957FF" />
      <stop offset="100%" stop-color="#32D8F5" />
    </linearGradient>

    <linearGradient id="grad-cyan-mint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#32D8F5" />
      <stop offset="100%" stop-color="#79F2C0" />
    </linearGradient>

    <linearGradient id="dist-area-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#32D8F5" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#7957FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#7957FF" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .mono-t { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', monospace; }
      .sans-t { font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="1000" height="230" rx="14" fill="url(#strip-bg)" stroke="#1C202C" stroke-width="1.5" />

  <!-- Section Title Bar -->
  <g transform="translate(25, 24)">
    <circle cx="6" cy="6" r="4" fill="#32D8F5" filter="url(#glow-subtle)" />
    <text x="18" y="10" class="mono-t" font-size="11.5" font-weight="700" fill="#F5F7FA" letter-spacing="1.5">MACHINE LEARNING &amp; MATHEMATICS BENCHMARK</text>
    <text x="500" y="10" class="mono-t" font-size="10" fill="#A4ADBA" letter-spacing="1">FOUNDATIONS IN APPLIED STATISTICAL MODELING</text>
  </g>

  <!-- ==================== MODULE 1: LINEAR REGRESSION ==================== -->
  <g transform="translate(20, 48)">
    <rect width="180" height="162" rx="10" fill="url(#card-panel-bg)" stroke="#1C202C" stroke-width="1" />
    <text x="14" y="22" class="sans-t" font-size="11" font-weight="700" fill="#F5F7FA">Linear Regression</text>
    <text x="14" y="36" class="mono-t" font-size="8.5" fill="#32D8F5">ŷ = Wᵀx + b · R²: 0.98</text>

    <!-- Plot Area -->
    <g transform="translate(14, 46)">
      <!-- Axes -->
      <line x1="8" y1="84" x2="148" y2="84" stroke="#252D3D" stroke-width="1" />
      <line x1="8" y1="84" x2="8" y2="8" stroke="#252D3D" stroke-width="1" />

      <!-- Fitted Line -->
      <line x1="16" y1="76" x2="140" y2="22" stroke="url(#grad-violet-cyan)" stroke-width="2" stroke-linecap="round" />

      <!-- Residuals (Error bars) -->
      <line x1="38" y1="67" x2="38" y2="58" stroke="#79F2C0" stroke-width="1" stroke-dasharray="2, 2" />
      <line x1="72" y1="52" x2="72" y2="60" stroke="#79F2C0" stroke-width="1" stroke-dasharray="2, 2" />
      <line x1="108" y1="36" x2="108" y2="42" stroke="#79F2C0" stroke-width="1" stroke-dasharray="2, 2" />
      <line x1="128" y1="27" x2="128" y2="20" stroke="#79F2C0" stroke-width="1" stroke-dasharray="2, 2" />

      <!-- Scatter Points -->
      <circle cx="38" cy="58" r="3.2" fill="#32D8F5" />
      <circle cx="54" cy="62" r="3" fill="#32D8F5" />
      <circle cx="72" cy="60" r="3.2" fill="#79F2C0" />
      <circle cx="90" cy="46" r="3" fill="#32D8F5" />
      <circle cx="108" cy="42" r="3.2" fill="#7957FF" />
      <circle cx="128" cy="20" r="3.2" fill="#32D8F5" />
    </g>
    <text x="14" y="148" class="mono-t" font-size="8" fill="#A4ADBA">min ||y - ŷ||₂² (OLS)</text>
  </g>

  <!-- ==================== MODULE 2: DECISION BOUNDARY ==================== -->
  <g transform="translate(215, 48)">
    <rect width="180" height="162" rx="10" fill="url(#card-panel-bg)" stroke="#1C202C" stroke-width="1" />
    <text x="14" y="22" class="sans-t" font-size="11" font-weight="700" fill="#F5F7FA">Decision Boundary</text>
    <text x="14" y="36" class="mono-t" font-size="8.5" fill="#79F2C0">P(y|x) = σ(Wᵀx)</text>

    <!-- Plot Area -->
    <g transform="translate(14, 46)">
      <!-- Non-linear Sigmoid Boundary -->
      <path d="M 12 78 Q 78 68 144 26" fill="none" stroke="#32D8F5" stroke-width="2" stroke-linecap="round" />
      <!-- Margin dashed boundaries -->
      <path d="M 12 66 Q 78 56 144 14" fill="none" stroke="#32D8F5" stroke-width="0.8" stroke-dasharray="3, 3" opacity="0.45" />
      <path d="M 12 90 Q 78 80 144 38" fill="none" stroke="#32D8F5" stroke-width="0.8" stroke-dasharray="3, 3" opacity="0.45" />

      <!-- Class 0: Violet Points -->
      <circle cx="28" cy="44" r="3.5" fill="#7957FF" />
      <circle cx="48" cy="34" r="3.2" fill="#7957FF" />
      <circle cx="68" cy="46" r="3.5" fill="#7957FF" />
      <circle cx="94" cy="28" r="3.2" fill="#7957FF" />
      <circle cx="120" cy="18" r="3.5" fill="#7957FF" />

      <!-- Class 1: Mint Points -->
      <circle cx="36" cy="84" r="3.5" fill="#79F2C0" />
      <circle cx="68" cy="80" r="3.2" fill="#79F2C0" />
      <circle cx="94" cy="68" r="3.5" fill="#79F2C0" />
      <circle cx="122" cy="54" r="3.2" fill="#79F2C0" />
      <circle cx="140" cy="62" r="3.5" fill="#79F2C0" />
    </g>
    <text x="14" y="148" class="mono-t" font-size="8" fill="#A4ADBA">Acc: 97.4% · ROC: 0.99</text>
  </g>

  <!-- ==================== MODULE 3: NEURAL NETWORK ==================== -->
  <g transform="translate(410, 48)">
    <rect width="180" height="162" rx="10" fill="url(#card-panel-bg)" stroke="#1C202C" stroke-width="1" />
    <text x="14" y="22" class="sans-t" font-size="11" font-weight="700" fill="#F5F7FA">Deep Neural Network</text>
    <text x="14" y="36" class="mono-t" font-size="8.5" fill="#7957FF">a^[l] = ReLU(W·a + b)</text>

    <!-- Network Graph -->
    <g transform="translate(18, 48)">
      <!-- Synaptic Lines -->
      <path d="M 20 20 L 74 12 M 20 20 L 74 34 M 20 20 L 74 56 M 20 20 L 74 78
               M 20 48 L 74 12 M 20 48 L 74 34 M 20 48 L 74 56 M 20 48 L 74 78
               M 20 76 L 74 12 M 20 76 L 74 34 M 20 76 L 74 56 M 20 76 L 74 78
               M 74 12 L 128 34 M 74 12 L 128 62
               M 74 34 L 128 34 M 74 34 L 128 62
               M 74 56 L 128 34 M 74 56 L 128 62
               M 74 78 L 128 34 M 74 78 L 128 62"
            stroke="#7957FF" stroke-width="0.7" opacity="0.4" />

      <!-- Hot Forward Pass Weights -->
      <line x1="20" y1="48" x2="74" y2="34" stroke="#32D8F5" stroke-width="1.6" opacity="0.85" />
      <line x1="74" y1="34" x2="128" y2="34" stroke="#79F2C0" stroke-width="1.8" opacity="0.9" />

      <!-- Input Layer (3) -->
      <circle cx="20" cy="20" r="4" fill="#32D8F5" />
      <circle cx="20" cy="48" r="4" fill="#32D8F5" />
      <circle cx="20" cy="76" r="4" fill="#32D8F5" />

      <!-- Hidden Layer (4) -->
      <circle cx="74" cy="12" r="4" fill="#7957FF" />
      <circle cx="74" cy="34" r="4.5" fill="#79F2C0" filter="url(#glow-subtle)" />
      <circle cx="74" cy="56" r="4" fill="#7957FF" />
      <circle cx="74" cy="78" r="4" fill="#7957FF" />

      <!-- Output Layer (2) -->
      <circle cx="128" cy="34" r="4.5" fill="#79F2C0" filter="url(#glow-subtle)" />
      <circle cx="128" cy="62" r="4" fill="#32D8F5" />
    </g>
    <text x="14" y="148" class="mono-t" font-size="8" fill="#A4ADBA">Backprop · Adam Opt</text>
  </g>

  <!-- ==================== MODULE 4: GAUSSIAN DISTRIBUTION ==================== -->
  <g transform="translate(605, 48)">
    <rect width="180" height="162" rx="10" fill="url(#card-panel-bg)" stroke="#1C202C" stroke-width="1" />
    <text x="14" y="22" class="sans-t" font-size="11" font-weight="700" fill="#F5F7FA">Gaussian Distribution</text>
    <text x="14" y="36" class="mono-t" font-size="8.5" fill="#32D8F5">N(μ, σ²) · 68–95–99.7</text>

    <!-- Bell Curve Area -->
    <g transform="translate(14, 48)">
      <!-- Baseline -->
      <line x1="8" y1="78" x2="146" y2="78" stroke="#252D3D" stroke-width="1" />

      <!-- Shaded PDF Area -->
      <path d="M 12 78 C 45 78, 55 18, 77 18 C 99 18, 109 78, 142 78 Z" fill="url(#dist-area-grad)" />

      <!-- Curve Stroke -->
      <path d="M 12 78 C 45 78, 55 18, 77 18 C 99 18, 109 78, 142 78" fill="none" stroke="url(#grad-cyan-mint)" stroke-width="2" />

      <!-- Mean Center Line μ -->
      <line x1="77" y1="18" x2="77" y2="78" stroke="#79F2C0" stroke-width="1.2" stroke-dasharray="2, 2" />

      <!-- Sigma Standard Deviation Markers -->
      <line x1="56" y1="46" x2="56" y2="78" stroke="#7957FF" stroke-width="0.8" stroke-dasharray="1.5, 2" opacity="0.6" />
      <line x1="98" y1="46" x2="98" y2="78" stroke="#7957FF" stroke-width="0.8" stroke-dasharray="1.5, 2" opacity="0.6" />

      <circle cx="77" cy="18" r="3.2" fill="#79F2C0" filter="url(#glow-subtle)" />
    </g>
    <text x="14" y="148" class="mono-t" font-size="8" fill="#A4ADBA">μ: 0.00 · σ: 1.00 (CI: 95%)</text>
  </g>

  <!-- ==================== MODULE 5: LOSS GRADIENT DESCENT ==================== -->
  <g transform="translate(800, 48)">
    <rect width="180" height="162" rx="10" fill="url(#card-panel-bg)" stroke="#1C202C" stroke-width="1" />
    <text x="14" y="22" class="sans-t" font-size="11" font-weight="700" fill="#F5F7FA">Loss Optimization</text>
    <text x="14" y="36" class="mono-t" font-size="8.5" fill="#7957FF">θ := θ - η∇J(θ)</text>

    <!-- Convex Loss Curve with Descent Steps -->
    <g transform="translate(14, 48)">
      <!-- Axes -->
      <line x1="10" y1="78" x2="144" y2="78" stroke="#252D3D" stroke-width="1" />
      <line x1="10" y1="78" x2="10" y2="10" stroke="#252D3D" stroke-width="1" />

      <!-- Convex Curve -->
      <path d="M 18 16 Q 74 86 136 28" fill="none" stroke="#7957FF" stroke-width="1.5" opacity="0.5" />

      <!-- Gradient Descent Steps along curve -->
      <path d="M 22 24 L 40 44 L 58 60 L 74 70" fill="none" stroke="#32D8F5" stroke-width="1.8" stroke-linecap="round" />

      <!-- Step Nodes -->
      <circle cx="22" cy="24" r="3" fill="#32D8F5" />
      <circle cx="40" cy="44" r="3" fill="#32D8F5" />
      <circle cx="58" cy="60" r="3" fill="#32D8F5" />
      <!-- Global Minima -->
      <circle cx="74" cy="70" r="4" fill="#79F2C0" filter="url(#glow-subtle)" />
    </g>
    <text x="14" y="148" class="mono-t" font-size="8" fill="#A4ADBA">Loss: 0.0142 · Converged</text>
  </g>
</svg>
